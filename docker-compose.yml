services:
  db:
    image: postgis/postgis:16-3.4
    container_name: senagros-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: senagros
    volumes:
      - senagros-pgdata:/var/lib/postgresql/data

volumes:
  senagros-pgdata:
