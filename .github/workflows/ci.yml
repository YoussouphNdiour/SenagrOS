name: CI

on:
  pull_request:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Bloquant, mais sur la variation et non sur le total : la base compte
      # une dette heritee que le lint, jamais execute avant la CI, avait
      # laissee s'accumuler. Le cliquet echoue des que le nombre d'erreurs
      # augmente, donc aucune nouvelle ne passe, sans exiger de solder la
      # dette d'un coup.
      #
      # L'etape precedente etait `continue-on-error`, donc affichee verte
      # alors que la commande echouait : la dette restait invisible.
      - name: Lint (cliquet)
        run: ./scripts/lint-ratchet.sh

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          NEXTAUTH_SECRET: build-placeholder
          NEXTAUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
