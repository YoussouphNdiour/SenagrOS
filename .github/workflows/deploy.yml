name: Build & Deploy SenagrOS

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: youssouphndiour/senagros

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy stack via Portainer
        run: |
          STACK_ID=$(curl -sk \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
            "${{ secrets.PORTAINER_URL }}/api/stacks" \
            | jq -r '.[] | select(.Name=="senagros") | .Id')

          COMPOSE=$(cat docker-compose.prod.yml)
          ENV_VARS='[
            {"name": "POSTGRES_PASSWORD", "value": "${{ secrets.POSTGRES_PASSWORD }}"},
            {"name": "NEXTAUTH_SECRET", "value": "${{ secrets.NEXTAUTH_SECRET }}"},
            {"name": "NEXTAUTH_URL", "value": "${{ secrets.NEXTAUTH_URL }}"}
          ]'

          if [ -z "$STACK_ID" ] || [ "$STACK_ID" = "null" ]; then
            echo "Creating new stack..."
            curl -sk -X POST \
              -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
              -H "Content-Type: application/json" \
              "${{ secrets.PORTAINER_URL }}/api/stacks/create/standalone/string?endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
              -d "$(jq -n \
                --arg name "senagros" \
                --arg compose "$COMPOSE" \
                --argjson env "$ENV_VARS" \
                '{Name: $name, StackFileContent: $compose, Env: $env}'
              )"
          else
            echo "Updating existing stack $STACK_ID..."
            curl -sk -X PUT \
              -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
              -H "Content-Type: application/json" \
              "${{ secrets.PORTAINER_URL }}/api/stacks/$STACK_ID?endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
              -d "$(jq -n \
                --arg compose "$COMPOSE" \
                --argjson env "$ENV_VARS" \
                '{StackFileContent: $compose, Env: $env, PullImage: true, Prune: true}'
              )"
          fi

      - name: Wait and health check
        run: |
          echo "Waiting for deployment..."
          sleep 20
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://2.59.156.226:3400" || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "SenagrOS is live! (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS - waiting..."
            sleep 10
          done
          echo "WARNING: Health check did not return 200/302 after 10 attempts"
          exit 1
